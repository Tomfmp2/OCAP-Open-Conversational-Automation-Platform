version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: ocap-evolution-api
    restart: always
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      - SERVER_URL=${EVOLUTION_BASE_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-ocap_evolution_secret_key}
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${OCAP_WEBHOOK_URL:-http://host.docker.internal:5000/api/webhooks/whatsapp}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_instances:/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  evolution_instances:
    driver: local
