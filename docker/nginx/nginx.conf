events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No anunciar la versión de nginx en cabeceras ni páginas de error.
    server_tokens off;
    # Igual que el límite de la API (Kestrel, 10 MB): lo que la API rechazaría no llega a cruzar la red interna.
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # Segunda barrera ante fuerza bruta (la API ya limita por IP y bloquea la cuenta): 10 intentos por minuto.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    upstream api_servers {
        server ocap-api:5000;
    }

    upstream frontend_servers {
        server ocap-frontend:3000;
    }

    server {
        listen 80;
        limit_conn perip 50;

        # Solo para Prometheus dentro de Docker; la API lo niega igualmente fuera de la red interna.
        location = /metrics { return 404; }

        location ~ ^/api/(auth/login|auth/refresh|setup$|auth/mfa/verify) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api_servers;
            include /etc/nginx/ocap-proxy.conf;
        }

        location /api/ {
            proxy_pass http://api_servers;
            include /etc/nginx/ocap-proxy.conf;
            proxy_read_timeout 120s;
        }

        location /hubs/ {
            proxy_pass http://api_servers;
            include /etc/nginx/ocap-proxy.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://frontend_servers;
            include /etc/nginx/ocap-proxy.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
