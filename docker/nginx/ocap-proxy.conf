# Cabeceras comunes hacia la API y el panel.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se reemplaza, no se encadena: lo que el cliente ponga en X-Forwarded-For no llega a la API (límites por IP).
proxy_set_header X-Forwarded-For $remote_addr;
# https solo si lo dice Caddy (perfil https); falsificarlo desde la red solo haría Secure la cookie de quien lo envía.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-Id $request_id;
proxy_hide_header X-Powered-By;
