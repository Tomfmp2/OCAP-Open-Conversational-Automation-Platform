name: OCAP Continuous Integration

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OCAP.slnx

      - name: Build solution (Release mode)
        run: dotnet build OCAP.slnx -c Release --no-restore

      - name: Run test suite
        run: dotnet test OCAP.slnx -c Release --no-build --verbosity normal
