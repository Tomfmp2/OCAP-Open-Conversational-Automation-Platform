name: OCAP Continuous Integration

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OCAP.slnx

      - name: Build
        # Un aviso nuevo rompe el build: así el código no acumula advertencias.
        run: dotnet build OCAP.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test with coverage
        run: >
          dotnet test OCAP.slnx -c Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results
          --logger "trx;LogFileName=backend.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            ./test-results/**
          if-no-files-found: ignore

  frontend:
    name: Frontend Lint Typecheck Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Frontend tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: dotnet vulnerable packages
        run: |
          dotnet restore OCAP.slnx
          dotnet list OCAP.slnx package --vulnerable --include-transitive 2>&1 | tee vuln-dotnet.txt
          if grep -q "has the following vulnerable packages" vuln-dotnet.txt; then
            echo "::error::Hay paquetes NuGet con vulnerabilidades conocidas (ver vuln-dotnet.txt)."
            exit 1
          fi

      - name: npm audit (frontend)
        working-directory: frontend
        # Solo dependencias de producción: las de desarrollo (lint, tests) no se publican en la imagen.
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee ../vuln-npm.txt

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: |
            vuln-dotnet.txt
            vuln-npm.txt

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM (filesystem)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  docker:
    name: Docker Build & Container Scan
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: ocap-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: ocap-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=
            API_INTERNAL_URL=http://ocap-api:5000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fijada por commit (v0.36.0): un tag se puede mover; el tag 0.28.0 que se usaba ya no existe.
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ocap-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy scan Frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ocap-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Save images as artifacts
        run: |
          docker save ocap-api:ci | gzip > ocap-api-ci.tar.gz
          docker save ocap-frontend:ci | gzip > ocap-frontend-ci.tar.gz

      - name: Upload docker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            ocap-api-ci.tar.gz
            ocap-frontend-ci.tar.gz
