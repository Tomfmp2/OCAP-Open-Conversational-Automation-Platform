version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ocap-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocap_db}
      POSTGRES_USER: ${POSTGRES_USER:-ocap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-OcapSecurePass2026!}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocap_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ocap-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ocap}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-OcapRabbit2026!}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: ocap-nats
    restart: always
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocap-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ocap-jaeger
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ocap-prometheus
    restart: always
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - ocap-api

  ocap-api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ocap-api
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ocap_db};Username=${POSTGRES_USER:-ocap_user};Password=${POSTGRES_PASSWORD:-OcapSecurePass2026!}"
      ConnectionStrings__Redis: "redis:6379"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-OcapEnterpriseSuperSecretJwtKey2026!}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-OcapEnterpriseSuperSecretJwtKey2026!}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-OcapEnterpriseVaultMasterKey2026Secure!}
      Security__Vault__MasterKey: ${VAULT_MASTER_KEY:-OcapEnterpriseVaultMasterKey2026Secure!}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Knowledge__UseInMemory: "false"
      Knowledge__VectorStore: "PgVector"
      EventBus__Provider: ${EVENTBUS_PROVIDER:-RabbitMQ}
      EventBus__ConnectionString: "amqp://${RABBITMQ_USER:-ocap}:${RABBITMQ_PASSWORD:-OcapRabbit2026!}@rabbitmq:5672/"
      EventBus__NatsUrl: "nats://nats:4222"
      EventBus__ImmediateDispatch: "false"
      EventBus__EnableOutbox: "true"
      OpenTelemetry__OtlpEndpoint: "http://jaeger:4317"
      OpenTelemetry__ServiceName: "OCAP.Api"
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__RootPath: /app/storage
      ConnectionStrings__Redis: "redis:6379"
      Bootstrap__Enabled: "true"
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ocap.io}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe_Admin_2026!}
    ports:
      - "5000:5000"
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ocap-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: ocap-frontend
    restart: always
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://ocap-api:5000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - ocap-api

  ocap-dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: ocap-dashboard
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - ocap-api

  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: ocap-evolution-api
    restart: always
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-EvolutionSecretApiKey}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: ocap-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ocap-api
      - ocap-frontend
      - ocap-dashboard

volumes:
  postgres_data:
  redis_data:
  api_storage:
