services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ocap-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocap_db}
      POSTGRES_USER: ${POSTGRES_USER:-ocap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-OcapSecurePass2026!}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocap_user} -d ${POSTGRES_DB:-ocap_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ocap-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ocap}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-OcapRabbit2026!}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: ocap-nats
    restart: always
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocap-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ocap-jaeger
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ocap-prometheus
    restart: always
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      ocap-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ocap-api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ocap-api
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ocap_db};Username=${POSTGRES_USER:-ocap_user};Password=${POSTGRES_PASSWORD:-OcapSecurePass2026!}"
      ConnectionStrings__Redis: "redis:6379"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-OcapEnterpriseSuperSecretJwtKey2026!}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-OcapEnterpriseSuperSecretJwtKey2026!}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-OcapEnterpriseVaultMasterKey2026Secure!}
      Security__Vault__MasterKey: ${VAULT_MASTER_KEY:-OcapEnterpriseVaultMasterKey2026Secure!}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Knowledge__UseInMemory: "false"
      Knowledge__VectorStore: "PgVector"
      EventBus__Provider: ${EVENTBUS_PROVIDER:-RabbitMQ}
      EventBus__ConnectionString: "amqp://${RABBITMQ_USER:-ocap}:${RABBITMQ_PASSWORD:-OcapRabbit2026!}@rabbitmq:5672/"
      EventBus__NatsUrl: "nats://nats:4222"
      EventBus__ImmediateDispatch: "false"
      EventBus__EnableOutbox: "true"
      OpenTelemetry__OtlpEndpoint: "http://jaeger:4317"
      OpenTelemetry__ServiceName: "OCAP.Api"
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__RootPath: /app/storage
      Bootstrap__Enabled: "true"
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ocap.io}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe_Admin_2026!}
      Bootstrap__TenantName: ${BOOTSTRAP_TENANT_NAME:-OCAP Default}
      Bootstrap__TenantSlug: ${BOOTSTRAP_TENANT_SLUG:-default}
      Google__ClientId: ${Google__ClientId:-}
      Google__ClientSecret: ${Google__ClientSecret:-}
      Google__RedirectUri: ${Google__RedirectUri:-http://localhost:5000/api/integrations/Google/connect}
      Google__UseInMemory: ${Google__UseInMemory:-false}
      AiProviders__OpenAI__ApiKey: ${AiProviders__OpenAI__ApiKey:-}
      AiProviders__OpenAI__ModelName: ${AiProviders__OpenAI__ModelName:-gpt-4o}
      AiProviders__Gemini__ApiKey: ${AiProviders__Gemini__ApiKey:-}
      AiProviders__Gemini__ModelName: ${AiProviders__Gemini__ModelName:-gemini-1.5-flash}
      AiProviders__Claude__ApiKey: ${AiProviders__Claude__ApiKey:-}
      AiProviders__Claude__ModelName: ${AiProviders__Claude__ModelName:-claude-3-5-sonnet-latest}
      AiProviders__Ollama__BaseUrl: ${AiProviders__Ollama__BaseUrl:-http://host.docker.internal:11434}
      AiProviders__Ollama__ModelName: ${AiProviders__Ollama__ModelName:-llama3}
      Telegram__BotToken: ${Telegram__BotToken:-}
      Cors__AllowedOrigins__0: ${PUBLIC_PANEL_URL:-http://localhost:3000}
      Installation__ConfigPath: /app/config
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    volumes:
      - api_storage:/app/storage
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  ocap-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        API_INTERNAL_URL: http://ocap-api:5000
    container_name: ocap-frontend
    restart: always
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://ocap-api:5000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      ocap-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ocap-dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: ocap-dashboard
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - ocap-api

  evolution-api:
    image: evoapicloud/evolution-api:v1.8.7
    container_name: ocap-evolution-api
    restart: always
    environment:
      SERVER_URL: ${EVOLUTION_API_URL:-http://localhost:8088}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-EvolutionSecretApiKey}
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ocap-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ocap-api
      - ocap-frontend
      - ocap-dashboard

volumes:
  postgres_data:
  redis_data:
  api_storage:
